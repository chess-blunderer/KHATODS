<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar · Khatod Hospital</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<script>try{if(!sessionStorage.getItem('kh_splash'))document.documentElement.classList.add('splash-on')}catch(e){}</script>
<script>try{if(!sessionStorage.getItem('kh_auth'))location.replace('../login.html')}catch(e){}</script>
</head>
<body data-page="calendar" data-title="Calendar" data-root="../" data-parent="">
<div class="app">
<aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
<div class="backdrop" id="backdrop"></div>
<div class="main">
<header class="topbar" id="topbar"></header>
<main class="content">
<div class="page-head"><div><h2>Calendar</h2><p>Pick a date to view or download that day's appointment report as a PDF.</p></div></div>
<div class="cal-layout">
  <div class="card">
    <div class="card-head"><div class="cal-nav"><span class="cal-title" id="calTitle"></span>
      <button class="icon-btn" id="calPrev" aria-label="Previous month"><i data-lucide="chevron-left"></i></button>
      <button class="btn btn-ghost btn-sm" id="calToday">Today</button>
      <button class="icon-btn" id="calNext" aria-label="Next month"><i data-lucide="chevron-right"></i></button></div></div>
    <div class="cal-grid" id="calGrid"></div>
    <p class="muted" id="calMonthInfo" style="margin-top:14px;font-size:13px"></p></div>
  <div class="card" id="dayPanel"></div>
</div>
</main></div></div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../js/main.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/pdf.js"></script>
<script src="../js/calendar.js"></script>
</body></html>
